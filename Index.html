<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Question 💗</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #f4efff, #fff7fb);
  font-family: "Arial", sans-serif;
  overflow: hidden;
}

.card {
  width: min(92vw, 520px);
  padding: 35px 28px 42px;
  text-align: center;
  background: rgba(255,255,255,.95);
  border-radius: 28px;
  box-shadow: 0 15px 45px rgba(100,70,130,.15);
}

.badge {
  font-size: 15px;
  letter-spacing: 3px;
  color: #555;
  margin-bottom: 18px;
}

.character {
  width: 190px;
  height: 190px;
  margin: 0 auto 18px;
  border-radius: 50%;
  background: #eee7f8;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 105px;
  user-select: none;
}

h1 {
  margin: 10px 0 16px;
  font-size: clamp(27px, 7vw, 38px);
  color: #222;
}

p {
  color: #777;
  line-height: 1.8;
  margin: 8px 0;
}

.buttons {
  margin-top: 28px;
  display: flex;
  justify-content: center;
  gap: 16px;
  min-height: 55px;
}

button {
  border: 0;
  border-radius: 15px;
  padding: 14px 25px;
  font-size: 17px;
  cursor: pointer;
  transition: transform .15s;
}

#yesBtn {
  background: #7950a8;
  color: white;
}

#yesBtn:hover {
  transform: scale(1.05);
}

#noBtn {
  background: #f3f3f3;
  color: #555;
  position: relative;
  z-index: 10;
}

.message {
  display: none;
  margin-top: 25px;
  font-size: 22px;
  color: #7950a8;
  font-weight: bold;
}
</style>
</head>

<body>
<div class="card">
  <div class="badge">A LITTLE QUESTION</div>

  <div class="character">🖤</div>

  <h1>ขอจีบเธอได้มั้ย? ♡</h1>

  <p>ไม่ได้อยากรีบร้อน แค่อยากค่อย ๆ ทำความรู้จักเธอ<br>
  ให้มากขึ้น</p>

  <p>ถ้าเธอโอเค เราจะตั้งใจทำให้ทุกวันมีรอยยิ้มนะ</p>

  <div class="buttons">
    <button id="yesBtn" onclick="sayYes()">จีบหน่อยได้ 💗</button>
    <button id="noBtn">ไม่ให้จีบ</button>
  </div>

  <div class="message" id="message">
    เย้! งั้นขอเริ่มจีบเลยนะ 🥰💗
  </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");

function moveButton() {
  const padding = 15;
  const maxX = window.innerWidth - noBtn.offsetWidth - padding;
  const maxY = window.innerHeight - noBtn.offsetHeight - padding;

  const x = Math.max(padding, Math.random() * maxX);
  const y = Math.max(padding, Math.random() * maxY);

  noBtn.style.position = "fixed";
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

// คอมพิวเตอร์: เอาเมาส์เข้าใกล้แล้วหนี
noBtn.addEventListener("mouseenter", moveButton);

// มือถือ: แตะแล้วหนี
noBtn.addEventListener("touchstart", function(e) {
  e.preventDefault();
  moveButton();
});

function sayYes() {
  document.getElementById("message").style.display = "block";
  document.getElementById("yesBtn").textContent = "ตกลงแล้วนะ 💕";
}
</script>
</body>
</html>
